name: Build a Docker image
description: Builds a Docker image
inputs:
  workdir:
    required: false
    description: Working directory
    default: "."
  app_name:
    required: true
    description: Application name
  dockerfile:
    required: true
    description: Path to the Dockerfile
  registry_host:
    required: false
    description: Registry hostname
  registry_user:
    required: true
    description: Registry username

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cd ${{ inputs.workdir }}
        docker buildx build --platform linux/amd64 --load --build-arg ARCH=amd64 \
          -t ${{ inputs.app_name }}:${{ github.sha }}-amd64 -f ${{ inputs.dockerfile }} .
        docker buildx build --platform linux/arm64v8 --load --build-arg ARCH=arm64v8 \
          -t ${{ inputs.app_name }}:${{ github.sha }}-arm64 -f ${{ inputs.dockerfile }} .
    - shell: bash
      run: |
        IMG_BASE_NAME="${{ inputs.registry_user }}/${{ inputs.app_name }}"
        if [ ! -z "${{ inputs.registry_host }}" ]; then
          IMG_BASE_NAME="${{ inputs.registry_host }}/${{ inputs.registry_user }}/${{ inputs.app_name }}"
        fi
        echo "IMG_BASE_NAME=${IMG_BASE_NAME}" >> ${{ github.env }}
        echo "SHA_SHORT=$(git rev-parse --short "${{ github.sha }}")" >> ${{ github.env }}
    - shell: bash
      run: |
        docker tag ${{ inputs.app_name }}:${{ github.sha }}-amd64 ${{ env.IMG_BASE_NAME }}:${{ github.sha }}-amd64
        docker tag ${{ inputs.app_name }}:${{ github.sha }}-arm64 ${{ env.IMG_BASE_NAME }}:${{ github.sha }}-arm64
                
        docker tag ${{ inputs.app_name }}:${{ github.sha }}-amd64 ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}-amd64
        docker tag ${{ inputs.app_name }}:${{ github.sha }}-arm64 ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}-arm64
        
        docker tag ${{ inputs.app_name }}:${{ github.sha }}-amd64 ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}-amd64
        docker tag ${{ inputs.app_name }}:${{ github.sha }}-arm64 ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}-arm64
        
        if [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ] ; then
          docker tag ${{ inputs.app_name }}:${{ github.sha }}-amd64 ${{ env.IMG_BASE_NAME }}:latest-amd64
          docker tag ${{ inputs.app_name }}:${{ github.sha }}-arm64 ${{ env.IMG_BASE_NAME }}:latest-arm64
        fi
    - shell: bash
      run: |
        docker push ${{ env.IMG_BASE_NAME }}:${{ github.sha }}-amd64
        docker push ${{ env.IMG_BASE_NAME }}:${{ github.sha }}-arm64
        docker manifest create ${{ env.IMG_BASE_NAME }}:${{ github.sha }} \
          ${{ env.IMG_BASE_NAME }}:${{ github.sha }}-amd64 \
          ${{ env.IMG_BASE_NAME }}:${{ github.sha }}-arm64
        docker manifest push ${{ env.IMG_BASE_NAME }}:${{ github.sha }}
        
        docker push ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}-amd64
        docker push ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}-arm64
        docker manifest create ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }} \
          ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}-amd64 \
          ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}-arm64
        docker manifest push ${{ env.IMG_BASE_NAME }}:${{ env.SHA_SHORT }}
        
        docker push ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}-amd64
        docker push ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}-arm64
        docker manifest create ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }} \
          ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}-amd64 \
          ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}-arm64
        docker manifest push ${{ env.IMG_BASE_NAME }}:${{ github.ref_name }}
        
        if [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ] ; then
          docker push ${{ env.IMG_BASE_NAME }}:latest-amd64
          docker push ${{ env.IMG_BASE_NAME }}:latest-arm64
          docker manifest create ${{ env.IMG_BASE_NAME }}:latest \
            ${{ env.IMG_BASE_NAME }}:latest-amd64 \
            ${{ env.IMG_BASE_NAME }}:latest-arm64
          docker manifest push ${{ env.IMG_BASE_NAME }}:latest
        fi

name: Setup Taskfile
description: Setups Taskfile runner

inputs:
  version:
    description: golanci-lint version to install
    required: true

runs:
  using: composite
  steps:
    - run: mkdir -p bin
      shell: sh
    - run: echo "$(pwd)/bin" >> $GITHUB_PATH
      shell: sh
    # Upstream install.sh greps checksums unanchored and breaks on the *.sbom.json entries added in v2.13+.
    - run: |
        set -eu
        name="golangci-lint-${VERSION}-linux-amd64"
        base="https://github.com/golangci/golangci-lint/releases/download/v${VERSION}"
        tmp=$(mktemp -d)
        curl -sSfL -o "$tmp/$name.tar.gz" "$base/$name.tar.gz"
        curl -sSfL -o "$tmp/checksums.txt" "$base/golangci-lint-${VERSION}-checksums.txt"
        (cd "$tmp" && grep " $name.tar.gz\$" checksums.txt | sha256sum -c -)
        tar -xzf "$tmp/$name.tar.gz" -C "$tmp"
        mv "$tmp/$name/golangci-lint" bin/
        rm -rf "$tmp"
        bin/golangci-lint version
      shell: sh
      env:
        VERSION: ${{ inputs.version }}

name: deploy-docker
on:
  workflow_call:
    inputs:
      debug:
        type: boolean
        default: false
      workdir:
        type: string
        default: "."
      app_name:
        type: string
        default: ${{ github.event.repository.name }}
      app_version:
        type: string
        default: ""
      app_addr:
        type: string
        default: 127.0.0.1
      app_int_port:
        type: string
        default: 9000
      app_ext_port:
        type: string
        default: 9000
      compose_filename:
        type: string
        default: docker-compose.yaml
      ssh_host:
        type: string
        required: true
      ssh_port:
        type: string
        required: true
      ssh_user:
        type: string
        required: true
      registry_host:
        type: string
        required: false
      registry_user:
        type: string
        required: false
      pre_script:
        type: string
        required: false
      dotenv:
        type: string
        required: false

    secrets:
      ssh_key:
        required: true
      registry_password:
        required: false
      pre_script:
        required: false
      dotenv:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: ashep/ci
          ref: v1
          path: .ci
      - name: Add .env variables
        run: |
          (cat <<EOF
          ${{ inputs.dotenv }}
          EOF
          ) >> ${{ inputs.workdir }}/.env

          (cat <<EOF
          ${{ secrets.dotenv }}
          EOF
          ) >> ${{ inputs.workdir }}/.env

          APP_VERSION="${{ inputs.app_version }}"
          if [ -z "$APP_VERSION" ]; then
            if [ "${{ github.ref_type }}" == "tag" ]; then
              APP_VERSION="${{ github.ref_name }}"
            else
              APP_VERSION=$(echo "${{ github.sha }}" | cut -c 1-7)
            fi
          fi

          APP_IMAGE="${{ github.repository_owner }}/${{ inputs.app_name }}:${APP_VERSION}"
          if [ -n "${{ inputs.registry_host }}" ]; then
            APP_IMAGE="${{ inputs.registry_host }}/${APP_IMAGE}"
          fi

          COMPOSE_PROJECT_NAME=$(echo "${{ inputs.app_name }}" | sed 's/\./_/g')

          (cat <<EOF
          REGISTRY_HOST=${{ inputs.registry_host }}
          APP_IMAGE=${APP_IMAGE}
          COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
          APP_OWNER=${{ github.repository_owner }}
          APP_NAME=${{ inputs.app_name }}
          APP_VERSION=${APP_VERSION}
          APP_ADDR=${{ inputs.app_addr }}
          APP_INT_PORT=${{ inputs.app_int_port }}
          APP_EXT_PORT=${{ inputs.app_ext_port }}
          EOF
          ) >> ${{ inputs.workdir }}/.env
          
          if [ "${{ inputs.debug }}" == "true" ]; then
            echo ".env contents:"
            cat ${{ inputs.workdir }}/.env
          fi
      - name: Docker login
        uses: docker/login-action@v3
        if: ${{ inputs.registry_host != '' }}
        with:
          registry: ${{ inputs.registry_host }}
          username: ${{ inputs.registry_user }}
          password: ${{ secrets.registry_password }}
      - name: Run pre-script
        shell: bash
        run: ${{ inputs.pre_script }}
      - name: Run secret pre-script
        shell: bash
        run: ${{ secrets.pre_script }}
      - name: Deploy
        shell: bash
        run: |
          mkdir -p ~/.ssh

          COMPOSE_FILENAME="${{ inputs.compose_filename }}"
          if [ ! -f "${{ inputs.workdir }}/${COMPOSE_FILENAME}" ]; then
            COMPOSE_FILENAME=".ci/base/docker-compose.yaml"
          fi
          echo COMPOSE_FILENAME=${COMPOSE_FILENAME}

          (cat <<EOF
          ${{ secrets.ssh_key }}
          EOF
          ) > ssh_id
          chmod 0600 ssh_id

          eval $(ssh-agent -s)
          ssh-keyscan -H -p "${{ inputs.ssh_port }}" "${{ inputs.ssh_host }}" > ~/.ssh/known_hosts
          ssh-add ssh_id
          
          cd ${{ inputs.workdir }}
          
          if [ "${{ inputs.debug }}" == "true" ]; then
            echo ".env contents:"
            cat .env
          fi
          
          docker context create remote --docker "host=ssh://${{ inputs.ssh_user }}@${{ inputs.ssh_host }}:${{ inputs.ssh_port }}"
          
          if [ "${{ inputs.debug }}" == "true" ]; then
            echo "docker compose config:"
            docker --context remote compose -f ${COMPOSE_FILENAME} --env-file .env config
          fi
          
          docker --context remote compose -f ${COMPOSE_FILENAME} --env-file .env up -d --build --always-recreate-deps --force-recreate --remove-orphans
